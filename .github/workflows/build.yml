name: Build Windows Exe

on:
  push:
    branches: [ main, master ]  # Runs whenever you push code

jobs:
  build:
    runs-on: windows-latest  # Boots up a clean Windows machine in the cloud

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole DB-openrouter-custom-tkinterV3.py

    - name: Upload Executable
      uses: actions/upload-artifact@v4.4.3
      with:
        name: DB-openrouter-custom-tkinterV3-windows-exe
        path: dist/DB-openrouter-custom-tkinterV3.exe
